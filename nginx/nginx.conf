worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # Static assets are served here, never by the Python process (research R10).
        # The volume is mounted read-only; nginx can read it and nothing can write it.
        location /static/ {
            alias /srv/static/;
            access_log off;
            expires 1h;
        }

        location / {
            proxy_pass         http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # The application decides the Secure cookie flag from this header.
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 30s;
        }
    }
}
