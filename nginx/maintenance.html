<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The platform is restarting</title>

  <!--
    Served by nginx when the application behind it does not answer, which
    happens for a few seconds whenever the backend is rebuilt or restarted.
    Before this page existed those seconds showed a raw Cloudflare error, which
    reads like the platform is broken rather than busy.

    Deliberately self-contained: no stylesheet, no font, no script. The one
    thing that is certainly running when this renders is nginx, so this page
    depends on nothing else. It carries its own colours in both themes rather
    than borrowing the design system it cannot reach.

    It refreshes itself every ten seconds, so a restart resolves without
    anybody pressing anything.
  -->
  <meta http-equiv="refresh" content="10">

  <style>
    :root {
      --ground:  #f5f7f9;
      --surface: #ffffff;
      --line:    #e3e7ec;
      --ink:     #10161f;
      --soft:    #5a6574;
      --accent:  #1d4ed8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ground:  #0f1419;
        --surface: #171e28;
        --line:    #2a323d;
        --ink:     #e6eaef;
        --soft:    #9aa7b6;
        --accent:  #8ab0ff;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--ground);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 15.6px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 1px 2px rgb(16 22 31 / 0.05), 0 2px 8px -2px rgb(16 22 31 / 0.06);
      padding: 40px 32px;
      max-width: 30rem;
      width: 100%;
      text-align: center;
    }

    .mark {
      width: 3rem;
      height: 3rem;
      border-radius: 12px;
      background: linear-gradient(140deg, var(--accent), var(--accent));
      color: var(--surface);
      font-weight: 700;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      letter-spacing: 0;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin: 0 0 10px;
      letter-spacing: -0.011em;
    }

    p { margin: 0 0 8px; color: var(--soft); }
    p:last-of-type { margin-bottom: 0; }

    .quiet {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 0.825rem;
      color: var(--soft);
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="mark">SA</span>

    <h1>The platform is restarting</h1>

    <p>
      Security Awareness Training is being updated and will be back in a moment.
      Nothing you have done has been lost.
    </p>

    <p class="quiet">
      This page checks again every ten seconds, so there is nothing to press.
    </p>
  </main>
</body>
</html>
