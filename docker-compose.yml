services:

  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      # A named volume, never a bind mount into this directory: the project
      # lives in an iCloud folder and a synced database file would be corrupted.
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    # No published port. The database is reachable only from the compose network.

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # The suite lives at the repository root, outside the build context, so it
      # is never baked into the image. Mounting it is what makes the documented
      # command work: docker compose exec backend pytest
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro
    # No published port. Only nginx reaches it.

  nginx:
    build: ./nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./backend/app/static:/srv/static:ro

volumes:
  db_data:
