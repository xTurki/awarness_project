services:

  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      # A named volume, never a bind mount into this directory: the project
      # lives in an iCloud folder and a synced database file would be corrupted.
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    # No published port. The database is reachable only from the compose network.

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # The suite lives at the repository root, outside the build context, so it
      # is never baked into the image. Mounting it is what makes the documented
      # command work: docker compose exec backend pytest
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro
      # Instructor image uploads. The first file storage in the project.
      - uploads:/data/uploads
    # No published port. Only nginx reaches it.

  nginx:
    build: ./nginx
    networks:
      default:
        # Fixed, so the tunnel can be told where nginx is without asking a name
        # server. Docker assigns addresses in start order otherwise, which is
        # stable in practice and not stable by contract.
        ipv4_address: 172.21.0.10
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # nginx.conf is a template rendered at container start. Its
      # client_max_body_size comes from this same number, plus a small margin
      # for multipart overhead, so the two limits cannot drift apart.
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-5}
    ports:
      - "80:80"
    volumes:
      - ./backend/app/static:/srv/static:ro
      # Uploaded images are served by nginx as static files, read-only.
      - uploads:/srv/uploads:ro

  # Publishes the platform at project.mylocaldomainserver.online. It makes an
  # outbound connection to Cloudflare and serves through that, so the router
  # needs no forwarded port and the machine needs no public address.
  #
  # It is not part of the platform. The three tiers above are the platform, and
  # they run identically with this service absent, which is how the test suite
  # and every local check still see the same three containers.
  tunnel:
    # Pinned, like nginx and mysql. `latest` meant the running connector was
    # six releases behind and saying so in its own logs, which is the kind of
    # drift a pinned version makes visible instead of silent.
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    # http2 rather than the default quic, which is TCP rather than UDP.
    #
    # quic-go asks for a 7 MiB UDP receive buffer and this container is granted
    # 416 KiB of it, and says so in its own log. The limit is in the Docker VM,
    # not the host, so it cannot be raised for one container. TCP needs no such
    # buffer, so this avoids the warning rather than living with it.
    #
    # It did not cause the intermittent 502s. Those came from a second
    # connector on this same tunnel that could not reach nginx.
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    # The dashboard names the origin `http://nginx:80`. A hosts entry answers
    # that name without asking any name server, so the connector reaches nginx
    # by address and nothing outside this file has to know.
    #
    # Kept because it costs nothing, not because the resolver ever failed here:
    # this connector has never logged a name it could not look up.
    extra_hosts:
      - "nginx:172.21.0.10"
    # No published port. The connection is outbound only.

networks:
  default:
    ipam:
      config:
        # Declared rather than inherited, so the address pinned above is inside
        # the subnet on any machine this is brought up on.
        - subnet: 172.21.0.0/16

volumes:
  db_data:
  uploads:
