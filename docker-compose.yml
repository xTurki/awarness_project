services:

  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      # Named volume (not a bind mount) to keep database files out of the project folder.
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Not published; only reachable inside the compose network.

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount the tests so you can run: docker compose exec backend pytest
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro
      # Uploaded images.
      - uploads:/data/uploads
    # Not published; only nginx connects to it.

  nginx:
    build: ./nginx
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Used for client_max_body_size in the nginx template.
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-5}
    ports:
      - "80:80"
    volumes:
      - ./backend/app/static:/srv/static:ro
      # Uploaded images are served by nginx as static files, read-only.
      - uploads:/srv/uploads:ro

  # Cloudflare tunnel: publishes the site at its public name. Outbound only,
  # so no extra port is published. The dashboard origin is http://nginx:80.
  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    # http2 (TCP) instead of quic, which needs a bigger UDP buffer than Docker allows.
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx

volumes:
  db_data:
  uploads:
