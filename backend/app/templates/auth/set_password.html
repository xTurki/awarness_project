{% extends "base.html" %}
{% block title %}Choose a password{% endblock %}

{% block content %}
<div class="form-narrow">
  <h1 class="h4 mb-3">Choose your own password</h1>
  <p class="text-body-secondary small">
    Your account was set up for you. Choose a password only you know before continuing —
    nothing else is reachable until you do.
  </p>

  <form method="post" action="/password/new" novalidate>
    <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}">

    <div class="mb-3">
      <label for="password" class="form-label">New password</label>
      <input type="password" class="form-control" id="password" name="password"
             autocomplete="new-password" required autofocus>
      <div class="form-text">At least {{ minimum }} characters.</div>
    </div>

    <div class="mb-3">
      <label for="confirm" class="form-label">Confirm password</label>
      <input type="password" class="form-control" id="confirm" name="confirm"
             autocomplete="new-password" required>
    </div>

    <button type="submit" class="btn btn-primary w-100">Save and continue</button>
  </form>
</div>
{% endblock %}
