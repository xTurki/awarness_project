{# Unread notifications count (set in rendering.render). No badge when zero. #}
<a class="nav-link position-relative{% if request.url.path.startswith('/notifications') %} active{% endif %}"
   href="/notifications">
  <i class="bi bi-bell" aria-hidden="true"></i> Notifications
  {% if unread_notifications %}
    <span class="badge rounded-pill text-bg-danger">{{ unread_notifications }}</span>
    <span class="visually-hidden">unread</span>
  {% endif %}
</a>
