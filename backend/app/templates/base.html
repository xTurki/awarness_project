<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Training Platform{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <style>
    /* Nothing here may assume a direction: the interface is English, LTR only. */
    body { min-height: 100vh; }
    main { padding-bottom: 3rem; }
    .form-narrow { max-width: 26rem; margin: 0 auto; }
  </style>
</head>
<body class="bg-body-tertiary">

  {% if account %}
    {% include "components/nav.html" %}
  {% endif %}

  <main class="container py-4">
    {% if message %}
      <div class="alert alert-{{ message_kind|default('danger') }}" role="alert">{{ message }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/htmx.min.js"></script>
</body>
</html>
