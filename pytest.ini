[pytest]
# Collection is scoped to tests/ deliberately. Phase 2 adds
# backend/app/models/test.py and backend/app/services/test_service.py, both of
# which match pytest's default test_*.py pattern and would otherwise be imported
# as test modules and fail.
testpaths = tests
python_files = test_*.py
addopts = -q
# tests/ holds no __init__.py, so pytest would otherwise put only tests/ on the
# path and `import app` would fail.
pythonpath = .
